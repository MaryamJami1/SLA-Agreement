; AO Mess — PHP settings for the web root (Hostinger runs PHP as FastCGI, which reads .user.ini).
; Uploads: the app itself refuses anything above 5 MB; these leave room for the multipart overhead.
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 5

; Errors are logged, never shown (the app sets these too; this covers failures before bootstrap).
display_errors = Off
display_startup_errors = Off
log_errors = On

; Sessions and cookies
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Keep responses modest and predictable
max_execution_time = 60
memory_limit = 256M
expose_php = Off
